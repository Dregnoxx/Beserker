[package]
name = "berserker-rgb"
version = "1.1.7"
edition = "2024"
rust-version = "1.95"

[dependencies]
anyhow = "1.0.104"

[build-dependencies]
winresource = "0.1.34"

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = [
    "wgpu_no_default_features",
    "default_fonts",
] }
# Uniquement le backend Direct3D 12 (GPU matériel ou WARP de Windows).
wgpu = { version = "30.0.1", default-features = false, features = [
    "dx12",
    "wgsl",
    "std",
    "parking_lot",
] }
hidapi = "2.6.7"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = [
    "glow",
    "default_fonts",
    "x11",
] }
libc = "0.2"

[profile.dev]
debug = 0
