[package]
name = "berserker-rgb"
version = "1.1.4"
edition = "2024"
rust-version = "1.85"
description = "Contrôle RGB per-touche et configuration du clavier Berserker BYGG (EVision V2, USB 320F:5041)"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = [
    "wgpu_no_default_features",
    "default_fonts",
] }
# Backend Direct3D 12 uniquement (GPU matériel ou WARP fourni par Windows).
wgpu = { version = "30.0.1", default-features = false, features = [
    "dx12",
    "wgsl",
    "std",
    "parking_lot",
] }
hidapi = "2.6.7"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = [
    "glow",
    "default_fonts",
    "x11",
] }
libc = "0.2"

[profile.dev]
debug = 0
